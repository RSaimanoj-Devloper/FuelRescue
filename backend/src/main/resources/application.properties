# ==============================================================================
# FuelRescue Spring Boot Configuration
# Database: Aiven Console-Managed PostgreSQL
# ==============================================================================

spring.application.name=fuelrescue-backend
server.port=8080

# Aiven PostgreSQL Connection
# Obtain values from Aiven Console: Service Overview -> Connection parameters
spring.datasource.url=${DB_URL:jdbc:postgresql://pg-fuelrescue-demo.aivencloud.com:25432/defaultdb?sslmode=require}
spring.datasource.username=${DB_USER:avnadmin}
spring.datasource.password=${DB_PASSWORD:AVNS_example_secret_token}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP for Aiven Cloud)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT Token Security Configuration
app.jwt.secret=${JWT_SECRET:FuelRescueNationalHighwaySuperSecretKey2026SecureString}
app.jwt.expiration-ms=86400000

# CORS Configuration for React Frontend
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://fuelrescue.vercel.app}

# Logging
logging.level.in.fuelrescue=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
