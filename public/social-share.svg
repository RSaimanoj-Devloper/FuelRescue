<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle Highway Lines -->
  <path d="M 0 520 L 1200 520" stroke="#334155" stroke-width="8" stroke-dasharray="40 30" opacity="0.4"/>
  <path d="M 0 560 L 1200 560" stroke="#ea580c" stroke-width="4" opacity="0.6"/>

  <!-- Glowing Beacon / Circle Accent -->
  <circle cx="1020" cy="220" r="160" fill="#ea580c" opacity="0.12" filter="url(#glow)"/>
  <circle cx="180" cy="120" r="100" fill="#f59e0b" opacity="0.08" filter="url(#glow)"/>

  <!-- Logo Icon Container -->
  <rect x="90" y="90" width="80" height="80" rx="20" fill="url(#accent)"/>
  <!-- Fuel Pump SVG Path -->
  <path d="M 120 115 L 140 115 C 145 115 148 118 148 123 L 148 145 L 112 145 L 112 123 C 112 118 115 115 120 115 Z" fill="#ffffff"/>
  <rect x="116" y="121" width="18" height="12" rx="2" fill="#ea580c"/>
  <path d="M 148 126 C 152 126 156 130 156 134 L 156 148" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Brand Title -->
  <text x="190" y="145" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="-1">
    Fuel<tspan fill="#f97316">Rescue</tspan>
  </text>
  
  <!-- Tagline Pill -->
  <rect x="90" y="210" width="370" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <circle cx="112" cy="229" r="6" fill="#22c55e"/>
  <text x="128" y="235" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="15" fill="#e2e8f0" letter-spacing="0.5">
    24/7 HIGHWAY EMERGENCY DISPATCH
  </text>

  <!-- Hero Headline -->
  <text x="90" y="320" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="56" fill="#ffffff" letter-spacing="-1.5">
    Never Stranded on the Highway.
  </text>
  <text x="90" y="380" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="44" fill="url(#accent)" letter-spacing="-1">
    Emergency Fuel, Towing &amp; Mechanics.
  </text>

  <!-- Description -->
  <text x="90" y="440" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="22" fill="#94a3b8">
    Instant roadside fuel delivery (Petrol &amp; Diesel), certified tow trucks, and rapid patrol dispatch.
  </text>

  <!-- 15-Min SLA Badge -->
  <rect x="90" y="490" width="340" height="56" rx="16" fill="#ea580c" fill-opacity="0.2" stroke="#ea580c" stroke-width="2"/>
  <text x="115" y="526" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="20" fill="#ffedd5">
    ⚡ 15-Minute Highway Response Promise
  </text>

  <!-- Stats Pill right side -->
  <g transform="translate(820, 360)">
    <rect width="290" height="186" rx="24" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="30" y="48" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="34" fill="#22c55e">
      99.4%
    </text>
    <text x="30" y="74" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="14" fill="#94a3b8">
      On-Time Highway Resolution
    </text>
    <line x1="30" y1="96" x2="260" y2="96" stroke="#334155" stroke-width="1"/>
    <text x="30" y="132" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="32" fill="#ffffff">
      12,400+
    </text>
    <text x="30" y="158" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="14" fill="#94a3b8">
      Stranded Travelers Rescued
    </text>
  </g>
</svg>
